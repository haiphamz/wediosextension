name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Xcode & Schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project ExtensionBrowser/ExtensionBrowser.xcodeproj

      - name: Build App (Unsigned Ad-hoc)
        run: |
          mkdir -p build/Payload
          set -o pipefail
          xcodebuild clean build \
            -project ExtensionBrowser/ExtensionBrowser.xcodeproj \
            -scheme ExtensionBrowser \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find compiled .app!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/

          cd build
          zip -r -y ExtensionBrowser.ipa Payload/
          cd ..
          echo "Success! Created ExtensionBrowser.ipa"
          ls -lh build/ExtensionBrowser.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtensionBrowser-IPA
          path: build/ExtensionBrowser.ipa
          retention-days: 30
